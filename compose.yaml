services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bakuraku
      POSTGRES_DB: bakuraku
      POSTGRES_PASSWORD: ${BAKURAKU_POSTGRES_PASSWORD:?Set BAKURAKU_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakuraku -d bakuraku"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
