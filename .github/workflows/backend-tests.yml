name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bakuraku
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bakuraku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bakuraku -d bakuraku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BAKURAKU_TEST_DATABASE_URL: postgresql+psycopg://bakuraku:ci-only-password@127.0.0.1:5432/bakuraku_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
