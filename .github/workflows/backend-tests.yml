name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "pytest.ini"
      - "frontend/**"
      - "tests/e2e/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pytest.ini"
      - "frontend/**"
      - "tests/e2e/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bakuraku
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bakuraku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bakuraku -d bakuraku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BAKURAKU_TEST_DATABASE_URL: postgresql+psycopg://bakuraku:ci-only-password@127.0.0.1:5432/bakuraku_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q

  poc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-e2e.txt
      - run: npm --prefix frontend ci
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q --junitxml=e2e-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-e2e-results
          path: e2e-results.xml
          if-no-files-found: ignore
